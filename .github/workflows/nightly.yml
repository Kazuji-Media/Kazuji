name: Nightly Build

on:
  #schedule:
  #  - cron: '0 2 * * 0'  # Every Sunday at 2:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes since last nightly
        id: check
        run: |
          # Get the date of the last nightly release
          LAST_NIGHTLY=$(gh release list --limit 100 | grep -E "^(nightly-|N[0-9]{8})" | head -1)
          
          if [ -z "$LAST_NIGHTLY" ]; then
            # No previous nightly, proceed with build
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            # Extract the release tag (first column)
            LAST_TAG=$(echo "$LAST_NIGHTLY" | awk '{print $1}')
            
            # Check if there are commits since this tag
            COMMIT_COUNT=$(git rev-list "$LAST_TAG"..HEAD --count 2>/dev/null || echo "0")
            
            if [ "$COMMIT_COUNT" -gt 0 ]; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "Found $COMMIT_COUNT commits since last nightly ($LAST_TAG)"
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "No changes since last nightly ($LAST_TAG)"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Prepare release signing
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE_FILE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name/KEYSTORE_FILE_BASE64/KEYSTORE_FILE}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions signing secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

          printf '%s' "$KEYSTORE_FILE_BASE64" | base64 --decode > keystore.jks
          chmod 600 keystore.jks
          test -s keystore.jks
          keytool -list -keystore keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build nightly APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew --no-daemon assembleNightly --stacktrace --no-configuration-cache

      - name: Verify nightly APK
        run: |
          apk=app/build/outputs/apk/nightly/app-nightly.apk
          test -s "$apk"
          ls -lh "$apk"
          sha256sum "$apk"

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks

      - name: Get version
        id: version
        run: |
          # Use short commit SHA for nightly tag
          COMMIT_SHA=$(git rev-parse --short=7 HEAD)
          DATE=$(date -u +"%Y%m%d")
          echo "version=nightly-$DATE-$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "display_name=Nightly $DATE ($COMMIT_SHA)" >> $GITHUB_OUTPUT

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Kazuji ${{ steps.version.outputs.display_name }}
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/nightly/app-nightly.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
