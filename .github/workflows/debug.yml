name: PR Debug Build (ephemeral signature)

on:
  pull_request:
    branches:
      - main
      - devel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build debug APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./gradlew assembleDebug --stacktrace --info --no-build-cache --no-configuration-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pr-debug-ephemeral-do-not-upgrade
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Comment PR with artifact link
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const comment = `PR-only debug APK compiled. Its signing key is **ephemeral** and this APK cannot update Kazuji Dev.\n\nArtifact (CI inspection only): [pr-debug-ephemeral-do-not-upgrade](${runUrl})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
